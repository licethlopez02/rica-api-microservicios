server:
  port: 8083

spring:
  application:
    name: consultas-service
  kafka:
    consumer:
      group-id: consultas-service-v2
  mongodb:
    uri: mongodb://localhost:27017/rica_consultas

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Cada línea de log lleva el servicio y el id de correlación de la petición
    level: "%5p [${spring.application.name},%X{correlationId:-}]"